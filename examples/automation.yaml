alias: Frame Energy Art update
triggers:
  - trigger: time_pattern
    minutes: "/15"
  - trigger: homeassistant
    event: start
    id: startup
conditions: []
actions:
  - if:
      - condition: trigger
        id: startup
    then:
      - delay: "00:01:00"
  - action: frame_energy.render
# restart: if one update ever gets stuck, the next one ends it and starts fresh.
# With "single" a stuck update would silently block all later ones.
mode: restart
