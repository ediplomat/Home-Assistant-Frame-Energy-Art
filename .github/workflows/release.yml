name: Release zip

# Attach frame_energy.zip to every published release. HACS installs from this
# file, and GitHub counts its downloads for each version.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/frame_energy/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest.json has version $version, but the release tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build the zip
        run: |
          cd custom_components/frame_energy
          rm -rf __pycache__
          zip -r ../../frame_energy.zip . -x "*.pyc"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" frame_energy.zip --clobber
